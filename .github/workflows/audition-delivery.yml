name: WUBROT Listening Review Download
on:
  push:
    branches: [audition-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render synthetic auditions only (no plugin build)
        run: |
          g++ -O3 -std=c++17 -ISource -Itests audition-review/SineCandidates.cpp -o "$RUNNER_TEMP/wubrot-audition"
          "$RUNNER_TEMP/wubrot-audition" audition-review/sine-wavs
      - uses: actions/upload-artifact@v4
        with:
          name: WUBROT-sine-candidates
          path: |
            audition-review/sine-wavs/
            audition-review/SINE-README.md
          retention-days: 90
          if-no-files-found: error
