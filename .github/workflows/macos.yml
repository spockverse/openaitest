name: Build WUBROT macOS AU and VST3
on:
  workflow_dispatch:
    inputs:
      package_installer:
        description: Build macOS pkg (requires all three supplied factory WAVs)
        type: boolean
        default: false
  push:
    branches: [main, work, "wubrot/**"]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check preset manifests
        run: python3 tools/validate_factory.py --allow-missing
      - name: Configure universal AU and VST3
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build plugin and tests
        run: cmake --build build --parallel 3
      - name: Test audio and project recall
        run: ctest --test-dir build --output-on-failure
      - name: Validate Audio Unit
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R build/WUBROT_artefacts/Release/AU/WUBROT.component "$HOME/Library/Audio/Plug-Ins/Components/"
          auval -v aumf Wbrt Spck
      - name: Upload macOS development plugins
        uses: actions/upload-artifact@v4
        with:
          name: WUBROT-macOS-AU-VST3
          path: |
            build/WUBROT_artefacts/Release/AU/
            build/WUBROT_artefacts/Release/VST3/
          if-no-files-found: error
      - name: Require real samples and package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_installer }}
        run: |
          python3 tools/validate_factory.py
          bash packaging/macos/package.sh build dist
      - name: Upload macOS installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: WUBROT-macOS-Installer
          path: dist/WUBROT-*.pkg
          if-no-files-found: error
