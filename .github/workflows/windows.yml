name: Build WUBROT Windows
on:
  workflow_dispatch:
    inputs:
      package_installer:
        description: Build setup.exe (requires all three supplied factory WAVs)
        type: boolean
        default: false
  push:
    branches: [main, work, "wubrot/**"]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check preset manifests
        run: python tools/validate_factory.py --allow-missing
      - name: Install pinned WebView2 SDK
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory webview2 -NonInteractive
      - name: Configure x64 plugin
        run: cmake -S . -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/webview2"
      - name: Build plugin and tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 *> build-output.log
          $task_build_status = $LASTEXITCODE
          Get-Content build-output.log
          if ($task_build_status -ne 0) { python tools/ci_error_annotation.py build-output.log }
          exit $task_build_status
      - name: Test audio, project recall and actual VST3 binary
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure *> test-output.log
          $task_test_status = $LASTEXITCODE
          Get-Content test-output.log
          if ($task_test_status -ne 0) { python tools/ci_error_annotation.py test-output.log }
          exit $task_test_status
      - name: Compile-check installer with temporary test content
        shell: pwsh
        run: |
          $fixture_root = Join-Path $env:RUNNER_TEMP "wubrot-installer-fixture"
          python tools/make_installer_fixture.py "$fixture_root"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_factory.py --root "$fixture_root/Resources"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DProjectRoot=$fixture_root" "/DPluginBundle=${{ github.workspace }}\build\WUBROT_artefacts\Release\VST3\WUBROT.vst3" "/DOutputDir=$fixture_root\out" packaging/windows/WUBROT.iss *> installer-test.log
          $task_installer_status = $LASTEXITCODE
          Get-Content installer-test.log
          if ($task_installer_status -ne 0) { python tools/ci_error_annotation.py installer-test.log }
          exit $task_installer_status
      - name: Upload VST3 development build
        uses: actions/upload-artifact@v4
        with:
          name: WUBROT-Windows-VST3
          path: build/WUBROT_artefacts/Release/VST3/
          if-no-files-found: error
      - name: Require real factory samples for installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_installer }}
        run: python tools/validate_factory.py
      - name: Build Windows installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_installer }}
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DProjectRoot=${{ github.workspace }}" "/DPluginBundle=${{ github.workspace }}\build\WUBROT_artefacts\Release\VST3\WUBROT.vst3" "/DOutputDir=${{ github.workspace }}\dist" packaging/windows/WUBROT.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload setup.exe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: WUBROT-Windows-Installer
          path: dist/WUBROT-Setup-*.exe
          if-no-files-found: error
