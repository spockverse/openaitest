name: Build WUBROT Windows
on:
  workflow_dispatch:
  push:
    branches: [main, work, "wubrot/**"]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check preset manifests
        run: python tools/validate_factory.py --allow-missing
      - name: Install pinned WebView2 SDK
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory webview2 -NonInteractive
      - name: Ensure runtime for actual native WebView2 test
        shell: pwsh
        run: |
          $task_runtime_paths = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe")
          $task_runtime = Get-ChildItem -Path $task_runtime_paths -ErrorAction SilentlyContinue
          if (-not $task_runtime) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP/WebView2Runtime.exe"
            $task_install = Start-Process "$env:RUNNER_TEMP/WebView2Runtime.exe" -ArgumentList '/silent','/install' -Wait -PassThru
            if ($task_install.ExitCode -ne 0) { throw "WebView2 test runtime installation failed: $($task_install.ExitCode)" }
          }
      - name: Configure x64 plugin
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake -S . -B build -A x64 "-DWUBROT_VERSION=0.2.${{ github.run_number }}" -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/webview2" *> configure-output.log
          $task_status = $LASTEXITCODE
          Get-Content configure-output.log
          if ($task_status -ne 0) { python tools/ci_error_annotation.py configure-output.log }
          exit $task_status
      - name: Build plugin and tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake --build build --config Release --parallel 2 *> build-output.log
          $task_build_status = $LASTEXITCODE
          Get-Content build-output.log
          if ($task_build_status -ne 0) { python tools/ci_error_annotation.py build-output.log }
          exit $task_build_status
      - name: Test audio, project recall and actual VST3 binary
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          ctest --test-dir build -C Release --output-on-failure *> test-output.log
          $task_test_status = $LASTEXITCODE
          Get-Content test-output.log
          if ($task_test_status -ne 0) { python tools/ci_error_annotation.py test-output.log }
          exit $task_test_status
      - name: Check paced callback cost against v0.2.43
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/Performance | Out-Null
          $env:WUBROT_CONTENT_DIR = Join-Path $PWD 'Resources'
          & build/Release/WubrotCallbackBenchmark.exe build/Performance v043 closed 5 timing-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/Release/WubrotCallbackBenchmark.exe build/Performance advanced closed 6 timing-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($task_name in @('v043', 'advanced')) {
            $task_report = Get-Content "build/Performance/$task_name-callback.json" -Raw | ConvertFrom-Json
            Write-Output "$task_name peak=$($task_report.observedPeak) latency=$($task_report.latencySamples)"
            $task_report.cases | Select-Object sampleRate, buffer, meanUs, p99Us, maxUs | Format-Table
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          exit $LASTEXITCODE
      - name: Test embedded editor interactions
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force build/EditorScreenshots | Out-Null
          $env:WUBROT_SCREENSHOTS = Join-Path $PWD 'build/EditorScreenshots'
          $env:WUBROT_VISUAL_TRACE = Join-Path $PWD 'build/VisualTelemetry.json'
          foreach ($task_test in @('FreshInstance', 'PresetBrowser', 'PowerShutdown', 'AudioReactiveField', 'StationaryGrid', 'DnaControls', 'RegionEditor', 'SizePopup', 'OrbAlignment', 'SampleLoading', 'WubrotMotionTests')) {
            node "tests/$task_test.cjs" *> browser-test-output.log
            $task_browser_status = $LASTEXITCODE
            Get-Content browser-test-output.log
            if ($task_browser_status -ne 0) {
              python tools/ci_error_annotation.py browser-test-output.log
              exit $task_browser_status
            }
          }
      - name: Upload editor screenshots and native bridge checks
        if: always() && hashFiles('build/EditorScreenshots/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: WUBROT-UI-Checks-0.2.${{ github.run_number }}
          path: build/EditorScreenshots/
          retention-days: 90
          if-no-files-found: error
      - name: Upload portable development ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WUBROT-0.2.${{ github.run_number }}-dev-Windows-x64
          path: build/WUBROT_artefacts/Release/VST3/
          retention-days: 90
          if-no-files-found: error
      - name: Upload compact callback timings
        if: always() && hashFiles('build/Performance/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: WUBROT-Performance-0.2.${{ github.run_number }}
          path: build/Performance/*-callback.json
          retention-days: 90
          if-no-files-found: error
